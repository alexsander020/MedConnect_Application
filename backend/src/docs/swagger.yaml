  /api/notifications/{id}/read:
    patch:
      summary: Marca notificação como lida
      tags:
        - Notificações
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
