openapi: 3.0.0
info:
  title: MedConnect API
  version: 1.0.0
  description: Documentação completa da API RESTful do ecossistema MedConnect para orçamentos de manipulação farmacêutica, pedidos e gestão em tempo real.

servers:
  - url: http://localhost:3000
    description: Servidor Local de Desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Requisição inválida

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operação realizada com sucesso

    LoginRequest:
      type: object
      required:
        - email
        - password
        - type
      properties:
        email:
          type: string
          format: email
          example: paciente@medconnect.com
        password:
          type: string
          format: password
          example: SenhaForte#123
        type:
          type: string
          enum: [user, pharmacy]
          example: user

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login realizado com sucesso
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'
        pharmacy:
          $ref: '#/components/schemas/PharmacyResponse'

    RefreshTokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'
        pharmacy:
          $ref: '#/components/schemas/PharmacyResponse'

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: paciente@medconnect.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          example: 9a8b7c6d5e4f3a2b1c0d
        newPassword:
          type: string
          format: password
          example: NovaSenhaForte#456

    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          example: a1b2c3d4e5f6

    UserCreateRequest:
      type: object
      required:
        - name
        - email
        - password
        - cpf
      properties:
        name:
          type: string
          example: Carlos Silva
        email:
          type: string
          format: email
          example: carlos@exemplo.com
        password:
          type: string
          format: password
          example: SenhaForte#123
        cpf:
          type: string
          example: "04938271043"
          description: CPF do paciente com validação por algoritmo dos dígitos verificadores
        phone:
          type: string
          example: (11) 98765-4321
        address:
          type: string
          example: Av. Paulista, 1000, Apto 52 - SP

    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: clx123456789
        name:
          type: string
          example: Carlos Silva
        email:
          type: string
          example: carlos@exemplo.com
        role:
          type: string
          enum: [PATIENT, ADMIN]
          example: PATIENT
        cpf:
          type: string
          example: "***.***.***-43"
          description: CPF mascarado para proteção de dados do paciente
        phone:
          type: string
          example: (11) 98765-4321
        address:
          type: string
          example: Av. Paulista, 1000, Apto 52 - SP
        createdAt:
          type: string
          format: date-time

    PharmacyCreateRequest:
      type: object
      required:
        - name
        - email
        - password
        - cnpj
      properties:
        name:
          type: string
          example: Farmácia Vida e Saúde
        email:
          type: string
          format: email
          example: contato@farmaciavida.com.br
        password:
          type: string
          format: password
          example: SenhaForte#123
        cnpj:
          type: string
          example: "04.252.011/0001-10"
        phone:
          type: string
          example: (11) 3456-7890
        address:
          type: string
          example: Rua das Flores, 250 - São Paulo, SP
        deliveryArea:
          type: string
          example: Grande São Paulo

    PharmacyResponse:
      type: object
      properties:
        id:
          type: string
          example: clx987654321
        name:
          type: string
          example: Farmácia Vida e Saúde
        email:
          type: string
          example: contato@farmaciavida.com.br
        cnpj:
          type: string
          example: "04252011000110"
        phone:
          type: string
          example: (11) 3456-7890
        address:
          type: string
          example: Rua das Flores, 250 - São Paulo, SP
        deliveryArea:
          type: string
          example: Grande São Paulo
        isVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    AnimalCreateRequest:
      type: object
      required:
        - name
        - species
        - weightGrams
      properties:
        name:
          type: string
          example: Rex
        species:
          type: string
          enum: [DOG, CAT, BIRD, REPTILE, SMALL_MAMMAL, EQUINE, OTHER]
          example: DOG
        breed:
          type: string
          example: Golden Retriever
        weightGrams:
          type: integer
          minimum: 10
          maximum: 1500000
          example: 28500
          description: Peso do animal em gramas (inteiro)
        birthDate:
          type: string
          format: date
          example: "2021-06-15"
        isFoodProducing:
          type: boolean
          default: false
          example: false
          description: Indica se o animal é destinado à produção/consumo humano
        notes:
          type: string
          example: Alérgico a corante caramelo. Sem dados sensíveis do tutor.

    AnimalUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Rex
        species:
          type: string
          enum: [DOG, CAT, BIRD, REPTILE, SMALL_MAMMAL, EQUINE, OTHER]
          example: DOG
        breed:
          type: string
          example: Golden Retriever
        weightGrams:
          type: integer
          minimum: 10
          maximum: 1500000
          example: 29000
        birthDate:
          type: string
          format: date
          example: "2021-06-15"
        isFoodProducing:
          type: boolean
          example: false
        notes:
          type: string
          example: Atualização de peso pós consulta

    AnimalResponse:
      type: object
      properties:
        id:
          type: string
          example: clxpet123
        tutorId:
          type: string
          example: clx123456789
        name:
          type: string
          example: Rex
        species:
          type: string
          enum: [DOG, CAT, BIRD, REPTILE, SMALL_MAMMAL, EQUINE, OTHER]
          example: DOG
        breed:
          type: string
          example: Golden Retriever
        weightGrams:
          type: integer
          example: 28500
        birthDate:
          type: string
          format: date-time
          example: "2021-06-15T00:00:00.000Z"
        isFoodProducing:
          type: boolean
          example: false
        notes:
          type: string
          example: Alérgico a corante caramelo
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PrescriptionResponse:
      type: object
      properties:
        id:
          type: string
          example: clxpresc123
        patientId:
          type: string
          example: clx123456789
        fileUrl:
          type: string
          example: http://localhost:3000/uploads/receita-123.jpg
        kind:
          type: string
          enum: [HUMAN, VETERINARY]
          example: VETERINARY
        petId:
          type: string
          nullable: true
          example: clxpet123
        prescriberName:
          type: string
          nullable: true
          example: Dr. Veterinário Silva
        prescriberCrmv:
          type: string
          nullable: true
          example: "12345"
        prescriberUf:
          type: string
          nullable: true
          example: SP
        vetDocumentType:
          type: string
          enum: [MAGISTRAL, CONTROLLED_NOTIFICATION]
          nullable: true
          example: MAGISTRAL
        controlledNotificationNumber:
          type: string
          nullable: true
          example: SIPEAGRO-2026-001
        requiresManualDocumentCheck:
          type: boolean
          example: false
        status:
          type: string
          enum: [PENDING, QUOTED, ACCEPTED, CANCELLED]
          example: PENDING
        createdAt:
          type: string
          format: date-time

    QuoteCreateRequest:
      type: object
      required:
        - prescriptionId
        - price
      properties:
        prescriptionId:
          type: string
          example: clxpresc123
        price:
          type: string
          example: "85.50"
          description: Preço em reais no formato decimal
        deliveryDays:
          type: integer
          example: 2
        pharmaceuticalForm:
          type: string
          example: BISCOITO_MEDICAMENTOSO
          description: Forma farmacêutica personalizada (ex. pasta oral, biscoito, cápsula)
        flavoring:
          type: string
          example: Carne
          description: Flavorizante palatabilizante para uso veterinário
        estimatedPreparationDays:
          type: integer
          example: 1
          description: Prazo estimado de manipulação técnica em dias
        notes:
          type: string
          example: Inclui biscoito palatabilizado sabor carne.

    QuoteResponse:
      type: object
      properties:
        id:
          type: string
          example: clxquote123
        prescriptionId:
          type: string
          example: clxpresc123
        pharmacyId:
          type: string
          example: clx987654321
        price:
          type: string
          example: "85.50"
          description: Preço em reais formatado com duas casas decimais
        priceCents:
          type: integer
          example: 8550
          description: Preço em centavos armazenado com precisão inteira
        deliveryDays:
          type: integer
          example: 2
        pharmaceuticalForm:
          type: string
          nullable: true
          example: BISCOITO_MEDICAMENTOSO
        flavoring:
          type: string
          nullable: true
          example: Carne
        estimatedPreparationDays:
          type: integer
          nullable: true
          example: 1
        notes:
          type: string
          example: Inclui frasco conta-gotas de 30ml
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, EXPIRED]
          example: PENDING
        createdAt:
          type: string
          format: date-time

    OrderCreateRequest:
      type: object
      required:
        - quoteId
      properties:
        quoteId:
          type: string
          example: clxquote123

    OrderStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PRODUCTION, DELIVERY, DELIVERED, CANCELLED]
          example: DELIVERY

    OrderStatusHistoryItem:
      type: object
      properties:
        id:
          type: string
          example: clxhist123
        orderId:
          type: string
          example: clxorder123
        fromStatus:
          type: string
          enum: [PRODUCTION, DELIVERY, DELIVERED, CANCELLED]
          example: PRODUCTION
        toStatus:
          type: string
          enum: [PRODUCTION, DELIVERY, DELIVERED, CANCELLED]
          example: DELIVERY
        changedByType:
          type: string
          example: pharmacy
        changedById:
          type: string
          example: clxpharm123
        createdAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          example: clxorder123
        quoteId:
          type: string
          example: clxquote123
        status:
          type: string
          enum: [PRODUCTION, DELIVERY, DELIVERED, CANCELLED]
          example: PRODUCTION
        animal:
          $ref: '#/components/schemas/AnimalResponse'
        tutor:
          $ref: '#/components/schemas/UserResponse'
        history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistoryItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AnonymousPrescriptionResponse:
      type: object
      description: Receita médica ou veterinária anonimizada para cotação por farmácias habilitadas (LGPD Art. 11 e D6)
      properties:
        id:
          type: string
          example: clxpresc123
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          example: PENDING
        kind:
          type: string
          enum: [HUMAN, VETERINARY]
          example: VETERINARY
        species:
          type: string
          example: DOG
        weightGrams:
          type: integer
          example: 25000
        approximateAgeMonths:
          type: integer
          example: 48
        prescriber:
          type: object
          properties:
            name:
              type: string
              example: Dr. Silva Vet
            crmv:
              type: string
              example: "12345"
            uf:
              type: string
              example: SP
        requiresManualDocumentCheck:
          type: boolean
          example: false
        patient:
          type: object
          properties:
            anonymousId:
              type: string
              example: Paciente #A1B2C

paths:
  /health:
    get:
      summary: Verificação de saúde da API (Process Liveness)
      tags:
        - Health
      responses:
        '200':
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: integer
                    example: 120
                  timestamp:
                    type: string
                    format: date-time

  /ready:
    get:
      summary: Verificação de prontidão da infraestrutura e banco de dados (Readiness Check)
      tags:
        - Health
      responses:
        '200':
          description: Banco de dados conectado e pronto para receber tráfego
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Falha de conexão com o banco de dados

  /metrics:
    get:
      summary: Métricas operacionais, taxa de erro e latência da API
      tags:
        - Health
      responses:
        '200':
          description: Métricas consolidadas do processo e requisições
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptimeSeconds:
                    type: integer
                    example: 3600
                  totalRequests:
                    type: integer
                    example: 1250
                  errorCount:
                    type: integer
                    example: 4
                  errorRate:
                    type: string
                    example: "0.32%"
                  pendingQuotes:
                    type: integer
                    example: 3
                  activeOrders:
                    type: integer
                    example: 5

  /api/auth/login:
    post:
      summary: Autenticação de Usuário ou Farmácia
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Credenciais ausentes ou inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: E-mail ou senha incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de tentativas de autenticação excedido (máximo 5 tentativas por 15 minutos)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Tempo em segundos antes de poder tentar novamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Muitas tentativas de autenticação. Tente novamente mais tarde.
                  retryAfter:
                    type: integer
                    example: 900

  /api/auth/refresh:
    post:
      summary: Rotação de Refresh Token
      description: Rotaciona o refresh token opaco recebido via cookie HttpOnly (ou payload opcional) e emite um novo access token JWT de 15 minutos com detecção de reuso.
      tags:
        - Autenticação
      responses:
        '200':
          description: Token renovado com sucesso e novo refresh token emitido via cookie HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Refresh token inválido, expirado ou reutilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Logout e revogação de tokens
      description: Revoga a família de refresh tokens associada e limpa o cookie HttpOnly da sessão.
      tags:
        - Autenticação
      responses:
        '200':
          description: Sessão encerrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/auth/forgot-password:
    post:
      summary: Solicitação de redefinição de senha
      description: Gera um token de recuperação de uso único com envio por e-mail. Para evitar enumeração de contas, a resposta é idêntica e executada em tempo constante para e-mails existentes e inexistentes.
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Instruções enviadas caso o e-mail exista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: E-mail em formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de solicitações excedido

  /api/auth/reset-password:
    post:
      summary: Redefinição de senha com token de uso único
      description: Valida o token de redefinição e atualiza a senha do usuário ou farmácia.
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido, expirado ou requisitos de senha não atendidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de solicitações excedido

  /api/auth/verify-email:
    post:
      summary: Verificação de e-mail por token
      description: Valida o endereço de e-mail do usuário/farmácia com token de uso único.
      tags:
        - Autenticação
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: E-mail verificado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Verificação de e-mail via link (query param token)
      tags:
        - Autenticação
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: Token de verificação de e-mail
      responses:
        '200':
          description: E-mail verificado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users:
    post:
      summary: Cadastro de novo paciente
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Paciente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Dados inválidos (CPF inválido, senha fraca ou campos obrigatórios ausentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail ou CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Listagem de todos os usuários (Requer ADMIN)
      tags:
        - Usuários
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Não autorizado
        '403':
          description: Acesso restrito a administradores

  /api/pharmacies:
    post:
      summary: Cadastro de nova farmácia de manipulação
      tags:
        - Farmácias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyCreateRequest'
      responses:
        '201':
          description: Farmácia cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyResponse'
        '400':
          description: Validação falhou (CNPJ inválido, senha fraca ou campos ausentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail ou CNPJ já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Listagem pública de farmácias parceiras
      tags:
        - Farmácias
      responses:
        '200':
          description: Lista de farmácias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PharmacyResponse'

  /api/animals:
    post:
      summary: Cadastro de novo animal de estimação sob guarda do tutor autenticado (Requer VET_ENABLED = true; caso contrário 404)
      tags:
        - Animais
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
      responses:
        '201':
          description: Animal cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '400':
          description: Erro de validação (peso fora da faixa plausível ou espécie inválida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
        '403':
          description: Acesso restrito a tutores/pacientes (PATIENT)
        '404':
          description: Funcionalidade veterinária desabilitada (VET_ENABLED = false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Listagem de animais ativos pertencentes ao tutor autenticado (Requer VET_ENABLED = true)
      tags:
        - Animais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de animais do tutor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnimalResponse'
        '401':
          description: Não autorizado
        '403':
          description: Acesso restrito a tutores/pacientes (PATIENT)
        '404':
          description: Funcionalidade veterinária desabilitada (VET_ENABLED = false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animals/{id}:
    get:
      summary: Detalhes de um animal específico do tutor autenticado (Prevenção a IDOR, 404 sem vazar existência)
      tags:
        - Animais
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identificador do animal
      responses:
        '200':
          description: Dados cadastrais do animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '401':
          description: Não autorizado
        '404':
          description: Animal não encontrado ou funcionalidade desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Atualização parcial de dados do animal do tutor
      tags:
        - Animais
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalUpdateRequest'
      responses:
        '200':
          description: Animal atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
        '404':
          description: Animal não encontrado ou funcionalidade desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Exclusão lógica (soft delete) do animal do tutor
      tags:
        - Animais
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Animal excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Não autorizado
        '404':
          description: Animal não encontrado ou funcionalidade desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prescriptions:
    post:
      summary: Envio de receita médica humana ou veterinária (Paciente/Tutor)
      tags:
        - Receitas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo da receita (imagem PNG/JPG ou PDF)
                kind:
                  type: string
                  enum: [HUMAN, VETERINARY]
                  default: HUMAN
                  description: Tipo da receita (HUMAN ou VETERINARY)
                petId:
                  type: string
                  description: Obrigatório se kind = VETERINARY. Identificador do animal pertencente ao tutor
                prescriberName:
                  type: string
                  description: Obrigatório se kind = VETERINARY. Nome do médico veterinário prescritor
                prescriberCrmv:
                  type: string
                  description: Obrigatório se kind = VETERINARY. Número do CRMV do prescritor
                prescriberUf:
                  type: string
                  description: Obrigatório se kind = VETERINARY. UF do CRMV do prescritor
                vetDocumentType:
                  type: string
                  enum: [MAGISTRAL, CONTROLLED_NOTIFICATION]
                  default: MAGISTRAL
                  description: Tipo documental veterinário (MAPA)
                controlledNotificationNumber:
                  type: string
                  description: Obrigatório se vetDocumentType = CONTROLLED_NOTIFICATION
                consent:
                  type: string
                  example: "true"
                  description: Consentimento para tratamento de dados sensíveis (LGPD Art. 11)
      responses:
        '201':
          description: Receita enviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '400':
          description: Arquivo ausente, CRMV com formato inválido ou campos obrigatórios faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
        '403':
          description: Consentimento revogado ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Funcionalidade veterinária desligada (VET_ENABLED = false) ou animal não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Bloqueio sanitário regulatório (ANIMAL_FOOD_PRODUCING_NOT_SUPPORTED ou CONTROLLED_NOT_SUPPORTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prescriptions/my:
    get:
      summary: Lista receitas do paciente logado com suas respectivas cotações
      tags:
        - Receitas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receitas do paciente com cotações recebidas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Não autorizado

  /api/prescriptions/pharmacy:
    get:
      summary: Lista receitas médicas abertas para cotação por farmácias (Anonimizado - LGPD Art. 11)
      tags:
        - Receitas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receitas com identificador anônimo, sem expor telefone, endereço nem arquivo da receita
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnonymousPrescriptionResponse'
        '401':
          description: Não autorizado
        '403':
          description: Acesso restrito a farmácias

  /api/quotes:
    post:
      summary: Envio de proposta de orçamento pela farmácia
      tags:
        - Cotações
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '201':
          description: Proposta de cotação enviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Dados inválidos ou preço incorreto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Farmácia não verificada para enviar cotações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receita não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Receita já aceita/cancelada ou cotação já enviada por esta farmácia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quotes/my:
    get:
      summary: Lista histórico de cotações enviadas pela farmácia logada
      tags:
        - Cotações
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Histórico de cotações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'

  /api/orders:
    post:
      summary: Paciente aprova uma cotação e cria o pedido
      tags:
        - Pedidos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido criado e cotação aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Dados inválidos da requisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Paciente não tem permissão para aprovar cotação de outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cotação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cotação já possui pedido ou receita já finalizada (conflito de estado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/my:
    get:
      summary: Lista pedidos do usuário (Paciente ou Farmácia)
      tags:
        - Pedidos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos com detalhes da farmácia ou do paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /api/orders/{id}:
    get:
      summary: Detalhes de um pedido específico (Protegido por IDOR)
      description: Retorna dados completos do pedido, incluindo endereço de entrega e arquivo da receita exclusivamente para o paciente dono ou a farmácia aceita.
      tags:
        - Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID do pedido
      responses:
        '200':
          description: Detalhes completos do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (IDOR)
        '404':
          description: Pedido não encontrado

  /api/orders/{id}/status:
    patch:
      summary: Atualiza status de produção/entrega do pedido (Farmácia proprietária)
      tags:
        - Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID do pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Status atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Status inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Apenas a farmácia dona deste pedido pode alterar o status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Transição de status não permitida pela máquina de estados do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prescriptions/{id}:
    get:
      summary: Consulta detalhes de uma receita
      tags:
        - Receitas
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados da receita
        '403':
          description: Acesso não autorizado
        '404':
          description: Receita não encontrada

  /api/prescriptions/{id}/quotes:
    get:
      summary: Lista cotações de uma receita para o paciente titular
      tags:
        - Receitas
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de propostas
        '403':
          description: Apenas o paciente dono pode ver as propostas desta receita

  /api/prescriptions/{id}/view-url:
    get:
      summary: Gera URL assinada de visualização privada (5 minutos) com auditoria
      tags:
        - Receitas
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL assinada de acesso temporário
        '403':
          description: Acesso restrito ao paciente titular ou à farmácia com pedido aceito

  /api/pharmacies/stats:
    get:
      summary: Retorna estatísticas e totais operacionais da farmácia autenticada
      tags:
        - Farmácias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métricas da farmácia (cotações, pedidos, faturamento, avaliações)

  /api/admin/pharmacies/pending:
    get:
      summary: Lista farmácias aguardando verificação regulatória (ADMIN)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Farmácias pendentes
        '403':
          description: Acesso restrito a administradores

  /api/admin/pharmacies/{id}/verify:
    patch:
      summary: Aprova ou reprova credenciamento sanitário da farmácia (ADMIN)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
