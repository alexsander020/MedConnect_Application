version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medconnect}
      POSTGRES_USER: ${POSTGRES_USER:-medconnect_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medconnect_dev_password_only_for_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medconnect_user} -d $${POSTGRES_DB:-medconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - sqlite_data:/app/prisma

volumes:
  postgres_data:
  api_uploads:
  sqlite_data:
