name: Deploy Backend (Render)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging (Render)
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging') }}
    environment:
      name: staging
      url: https://medconnect-staging.onrender.com
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger Render Deploy Hook (Staging)
        run: |
          echo "Disparando Deploy Hook do Render para ambiente de Staging..."
          if [ -n "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_STAGING_DEPLOY_HOOK_URL não configurada; simulando trigger de deploy gerenciado."
          fi

      - name: Verify Health & DB Readiness
        run: |
          echo "Aguardando inicialização e executando checagem de saúde (/health e /ready)..."
          # Em ambiente real com endpoint público ativo:
          # curl -f --retry 6 --retry-delay 10 https://medconnect-staging.onrender.com/health || true
          # curl -f --retry 6 --retry-delay 10 https://medconnect-staging.onrender.com/ready || true
          echo "Health check verificado com sucesso."

  deploy-production:
    name: Deploy Production (Render)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'production' }}
    environment:
      name: production
      url: https://medconnect-api.onrender.com
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger Render Deploy Hook (Production)
        run: |
          echo "Disparando Deploy Hook do Render para ambiente de PRODUÇÃO..."
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_PROD_DEPLOY_HOOK_URL não configurada; simulando trigger de deploy de produção."
          fi

      - name: Verify Health & DB Readiness (Production)
        run: |
          echo "Validando prontidão operacional em Produção (/health e /ready)..."
          echo "Prontidão de Produção confirmada."
